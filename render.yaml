services:
  - type: web
    name: certa-backend-api
    runtime: python
    plan: free
    # La migracion corre aqui. Con DEBUG en falso el servicio no crea tablas
    # por su cuenta, de modo que sin este paso la base quedaria vacia y todo
    # recorrido responderia error en el primer despliegue.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # El origen del cliente web. Sin el, el navegador bloquea toda peticion.
      # No es secreto, de modo que va versionado y no hay que recordarlo al
      # recrear el servicio.
      - key: CORS_ORIGINS
        value: https://certa-upc.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_MODEL_VERSION
        sync: false
      - key: BUDGET_MAX_QUERIES
        value: "3000"
      - key: DEBUG
        value: "false"

  # Proceso desatendido. Toma trabajos de la cola y ejecuta la cadena de
  # validación. Va aparte del servicio web porque validar un hallazgo tarda
  # entre diez y veinticinco segundos y un lote son horas: dentro de una
  # petición HTTP no sobrevive, y un reinicio del servicio se lo llevaría.
  #
  # No corre migraciones: de eso se encarga el servicio web, y hacerlo desde dos
  # sitios a la vez arriesga aplicarlas dos veces.
  - type: worker
    name: certa-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: REPOSITORY_ROOT
        sync: false
      # Cuántos hallazgos toma por ciclo. Sin valor, todos los pendientes de la
      # ejecución que reclamó.
      - key: WORKER_BATCH_SIZE
        sync: false
      # Ata el trabajador a un proyecto. Sin esto tomaria cualquier ejecucion
      # pendiente, incluida la de un repositorio que este trabajador no tiene
      # en disco, y la consumiria entera sin poder procesarla.
      - key: WORKER_PROJECT_ID
        sync: false
